syntax = "proto3";

option csharp_namespace = "order_service.OrderService.API.Proto";

package order_service_grpc;

service OrderGrpc {
  rpc ViewOrderDetail(RequestOrder) returns (ResponseOrder);
}

message RequestOrder {
  string id_order = 1;
}

message ResponseOrder {
  string id_order = 1;
  string PaymentMethod = 2;
  repeated OrderItem order_items = 3;
  string message_status = 4;
  int64 amount = 5;
}


message OrderItem {
  string product_id = 1;
  int32 quantity = 2;
}