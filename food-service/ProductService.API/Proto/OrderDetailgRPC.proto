syntax = "proto3";

option csharp_namespace = "order_service.OrderService.API.Proto";

package order_service_grpc;

service OrderGrpc {
  rpc ViewOrderDetail(RequestOrder) returns (ResponseOrder);
}

message RequestOrder {
  string id_order = 1;
}

message ResponseOrder {
  string id_order = 1;
  repeated OrderItem order_items = 2;
  string message_status = 3;
}

message OrderItem {
  string product_id = 1;
  int32 quantity = 2;
}